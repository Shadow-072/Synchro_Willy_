<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <style>
      .bg-badge { fill: #161F2E; stroke: #00B4D8; stroke-width: 24; }
      .bg-ring  { fill: none; stroke: #203348; stroke-width: 8; }
      .fur-dark { fill: #723C1A; stroke: #261307; stroke-width: 14; stroke-linejoin: round; }
      .fur-main { fill: #9E5828; stroke: #261307; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; }
      .fur-cream{ fill: #FBE6C4; stroke: #261307; stroke-width: 12; stroke-linejoin: round; stroke-linecap: round; }
      .fur-ear-in{ fill: #E8A88A; stroke: #261307; stroke-width: 10; }
      .outline  { stroke: #261307; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .teeth    { fill: #FFFFFF; stroke: #261307; stroke-width: 10; stroke-linejoin: round; }
      .nose     { fill: #261307; }
      .eye-pupil{ fill: #261307; }
      .eye-shine{ fill: #FFFFFF; }
      .accent   { fill: #00B4D8; stroke: #261307; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; }
      .accent-dark { fill: #0088A8; stroke: #261307; stroke-width: 12; }
      .tail-grid{ stroke: #542B12; stroke-width: 8; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Insignia circular de fondo (para contraste sobre fondo oscuro) -->
  <circle class="bg-badge" cx="512" cy="512" r="480" />
  <circle class="bg-ring" cx="512" cy="512" r="450" />

  <!-- Cola ancha de castor -->
  <g id="tail">
    <ellipse class="fur-dark" cx="750" cy="690" rx="140" ry="85" transform="rotate(25 750 690)" />
    <!-- Cuadrícula / textura plana de la cola -->
    <line class="tail-grid" x1="650" y1="660" x2="840" y2="740" />
    <line class="tail-grid" x1="670" y1="620" x2="860" y2="700" />
    <line class="tail-grid" x1="690" y1="730" x2="820" y2="640" />
    <line class="tail-grid" x1="730" y1="770" x2="850" y2="680" />
  </g>

  <!-- Patas traseras -->
  <ellipse class="fur-dark" cx="360" cy="800" rx="75" ry="40" />
  <ellipse class="fur-dark" cx="620" cy="800" rx="75" ry="40" />

  <!-- Cuerpo redondeado -->
  <ellipse class="fur-main" cx="490" cy="650" rx="195" ry="185" />
  <!-- Panza clara -->
  <ellipse class="fur-cream" cx="490" cy="665" rx="130" ry="135" />

  <!-- Orejas redondeadas -->
  <g id="ears">
    <circle class="fur-main" cx="350" cy="310" r="55" />
    <circle class="fur-ear-in" cx="350" cy="310" r="32" />
    <circle class="fur-main" cx="630" cy="310" r="55" />
    <circle class="fur-ear-in" cx="630" cy="310" r="32" />
  </g>

  <!-- Cabeza redondeada y tierna -->
  <circle class="fur-main" cx="490" cy="420" r="175" />

  <!-- Mejillas / Hocico crema -->
  <ellipse class="fur-cream" cx="435" cy="475" rx="75" ry="60" />
  <ellipse class="fur-cream" cx="545" cy="475" rx="75" ry="60" />

  <!-- Dos dientes frontales planos blancos -->
  <rect class="teeth" x="455" y="505" width="32" height="46" rx="6" />
  <rect class="teeth" x="493" y="505" width="32" height="46" rx="6" />
  <!-- Sonrisa tierna -->
  <path d="M 405 470 Q 435 505 480 495 Q 525 505 575 470" fill="none" stroke="#261307" stroke-width="12" stroke-linecap="round" />

  <!-- Nariz ovalada -->
  <ellipse class="nose" cx="490" cy="445" rx="34" ry="24" />
  <ellipse cx="480" cy="438" rx="10" ry="6" fill="#FFFFFF" opacity="0.6" />

  <!-- Ojos grandes y expresivos -->
  <ellipse class="eye-pupil" cx="410" cy="375" rx="32" ry="42" />
  <circle class="eye-shine" cx="400" cy="360" r="14" />
  <circle class="eye-shine" cx="422" cy="388" r="7" />
  <!-- Guiño simpático derecho -->
  <path d="M 545 385 Q 575 350 605 385" fill="none" stroke="#261307" stroke-width="14" stroke-linecap="round" />

  <!-- Cejas expresivas -->
  <path d="M 385 320 Q 415 310 435 325" fill="none" stroke="#261307" stroke-width="10" stroke-linecap="round" />
  <path d="M 545 325 Q 565 310 595 320" fill="none" stroke="#261307" stroke-width="10" stroke-linecap="round" />

  <!-- Variante 3: Gorra técnica cian de perfil redondeado -->
  <path class="accent" d="M 370 310 C 370 210, 610 210, 610 310 Z" />
  <!-- Visera de la gorra -->
  <path class="accent-dark" d="M 345 310 C 345 285, 635 285, 635 310 L 610 330 L 370 330 Z" />
  <!-- Insignia en la gorra -->
  <circle cx="490" cy="265" r="20" fill="#FFFFFF" stroke="#261307" stroke-width="8" />
  <!-- Engranaje / símbolo técnico en la gorra -->
  <circle cx="490" cy="265" r="8" fill="#00B4D8" />
  <!-- Patita izquierda con pulgar arriba (Thumbs Up) -->
  <ellipse class="fur-main" cx="335" cy="600" rx="48" ry="40" />
  <rect class="fur-main" x="320" y="530" width="28" height="45" rx="12" transform="rotate(-10 320 530)" />
  <!-- Destello de aprobación cian -->
  <path d="M 300 520 L 290 510 M 320 500 L 320 485 M 345 510 L 355 500" stroke="#00B4D8" stroke-width="8" stroke-linecap="round" />
  <!-- Patita derecha apoyada en la panza -->
  <ellipse class="fur-main" cx="630" cy="640" rx="45" ry="36" transform="rotate(-15 630 640)" />
</svg>
